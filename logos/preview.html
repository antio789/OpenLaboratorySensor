<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Gas Meter logo candidates</title>
<style>
  body { font-family: sans-serif; background: #f4f6f9; margin: 40px; }
  .row { display: flex; gap: 40px; }
  .cell { text-align: center; }
  .light, .dark { padding: 30px; border-radius: 16px; display: inline-block; }
  .dark { background: linear-gradient(to right, #0f2b33, #164552); }
  .light { background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  img.sm { width: 64px; } img.lg { width: 160px; }
  p { color: #2c3e50; }
</style>
</head>
<body>
<h1>Gas Meter — logo candidates</h1>
<p>Each shown small (64px, like the dashboard), large (160px), and on light + dark backgrounds.</p>
<table>

  <tr><td><h2>A — bubble + graduation ticks</h2></td></tr>
  <tr>
    <td><div class="light"><img class="lg" src="candidate_a_bubble_ticks.png"></div>
        <div class="dark"><img class="lg" src="candidate_a_bubble_ticks.png"></div></td>
    <td><div class="light"><img class="sm" src="candidate_a_bubble_ticks.png"></div>
        <div class="dark"><img class="sm" src="candidate_a_bubble_ticks.png"></div></td>
  </tr>
  <tr><td><h2>B — cycle arrow + droplet</h2></td></tr>
  <tr>
    <td><div class="light"><img class="lg" src="candidate_b_cycle_droplet.png"></div>
        <div class="dark"><img class="lg" src="candidate_b_cycle_droplet.png"></div></td>
    <td><div class="light"><img class="sm" src="candidate_b_cycle_droplet.png"></div>
        <div class="dark"><img class="sm" src="candidate_b_cycle_droplet.png"></div></td>
  </tr>
  <tr><td><h2>C — flask + bubbles</h2></td></tr>
  <tr>
    <td><div class="light"><img class="lg" src="candidate_c_flask.png"></div>
        <div class="dark"><img class="lg" src="candidate_c_flask.png"></div></td>
    <td><div class="light"><img class="sm" src="candidate_c_flask.png"></div>
        <div class="dark"><img class="sm" src="candidate_c_flask.png"></div></td>
  </tr>
</table>
</body>
</html>
